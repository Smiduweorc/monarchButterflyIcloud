name: Docs

# pkg.go.dev builds the documentation itself from the module proxy; there is
# nothing to host. This workflow (1) checks on every PR that the docs render
# with pkgsite, and (2) on a release tag asks proxy.golang.org for the new
# version, which makes pkg.go.dev index it within minutes instead of whenever
# someone first requests it.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render docs with pkgsite
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pinned tools
        uses: jdx/mise-action@v4

      - name: Serve and fetch the package page
        run: |
          module="$(go list -m)"
          pkgsite -open=false -http=localhost:6060 . &
          for _ in $(seq 60); do
            curl -fsS "http://localhost:6060/$module" -o page.html && break
            sleep 2
          done
          grep -q 'Documentation' page.html || { echo "pkgsite did not render $module" >&2; exit 1; }

  publish:
    name: Index on pkg.go.dev
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pinned tools
        uses: jdx/mise-action@v4

      # `go list -m` handles the proxy's case-encoding of upper-case module
      # paths. Run outside the module so the module's own go.mod is not used.
      - name: Request the version from the module proxy
        env:
          TAG: ${{ github.ref_name }}
          GOPROXY: https://proxy.golang.org
        run: |
          module="$(go list -m)"
          cd "$RUNNER_TEMP"
          go list -m "${module}@${TAG}"
          echo "https://pkg.go.dev/${module}@${TAG}"
