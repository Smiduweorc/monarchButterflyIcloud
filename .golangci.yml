# golangci-lint v2: https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - godot
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming

formatters:
  enable:
    - gofmt
    - goimports
